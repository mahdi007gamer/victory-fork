name: CI

on:
  pull_request:
  push:
    branches: [main, development/independent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup show
          rustc -Vv
          cargo -V
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked -p victory
      - name: CLI smoke test
        run: |
          & .\target\release\victory.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build metadata
        run: |
          New-Item -ItemType Directory -Force ci-output | Out-Null
          Copy-Item target/release/victory.exe ci-output/
          (Get-FileHash ci-output/victory.exe -Algorithm SHA256).Hash.ToLower() + "  victory.exe" | Set-Content ci-output/SHA256SUMS.txt
          git rev-parse HEAD | Set-Content ci-output/commit.txt
          rustc -Vv | Set-Content ci-output/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: victory-windows-x64-${{ github.sha }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
